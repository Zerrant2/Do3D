<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; connect-src blob: data:; base-uri 'none'; form-action 'none'">
  <title>Do3D · Model Viewer</title>
  <style><!-- STYLES --></style>
</head>
<body>
  <header class="toolbar">
    <div class="identity">
      <span class="brand">Do<span>3D</span></span>
      <h1 id="filename">Model viewer</h1>
    </div>
    <div class="actions">
      <div class="file-actions" aria-label="Model files" role="group">
        <button id="open-model">Open model</button>
        <button id="open-folder">Open folder</button>
        <input type="file" id="files" multiple hidden>
        <input type="file" id="folder" webkitdirectory multiple hidden>
        <select id="model-list" aria-label="Choose a model" hidden></select>
      </div>
      <div class="display-actions" aria-label="Display controls" role="group">
        <div class="toggles">
          <button id="lighting" aria-pressed="true" disabled>Lighting</button>
          <button id="wireframe" aria-pressed="false" disabled>Wireframe</button>
        </div>
        <button id="reset" disabled>Reset view</button>
      </div>
    </div>
  </header>
  <main id="viewport" aria-label="3D model viewport" aria-describedby="navigation">
    <div id="panel">
      <h2 id="status" role="status">Drop a GLB or glTF here</h2>
      <p id="hint">Use Open folder for a model with linked textures or buffers.</p>
      <button id="sample">Try sample</button>
    </div>
  </main>
  <footer>
    <span id="metrics"></span>
    <span id="navigation">Drag to orbit <span>·</span> Scroll to zoom <span>·</span> Right-drag to pan</span>
  </footer>
  <!--
  <!-- LICENSE -->
  -->
  <script id="sample-model" type="application/octet-stream"><!-- SAMPLE --></script>
  <script id="startup-model" type="application/json">null</script>
  <script>/* VIEWER */</script>
</body>
</html>
